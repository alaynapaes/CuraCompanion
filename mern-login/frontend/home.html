<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Dosis:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            position: relative;
            width: 100%;
            min-height: 100vh;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("extra_photo.png");
            backdrop-filter: blur(3px);
            background-size: cover;
            background-position: center;
            font-family: 'Roboto', sans-serif;
        }

        .container{
            position: relative;
            width: 90%;
            height: 87vh;
            border: 5px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logout{
            position: absolute;
            top: 10px;
            right: 0;
            padding: 10px 20px;
            text-transform: capitalize;
            font-size: 16px;
            color: #000000;
            background: none;
            text-decoration: underline;
            cursor: pointer;
            outline: none;
            border: none;
        }

        .greeting{
            z-index: 1;
            font-family: 'Dosis', sans-serif;
            font-size: 100px;
            color: #170202;
            font-weight: 800;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="logout">log out</button>
        <h1 class="greeting"></h1>
    </div>

    <script src="home.js"></script>
</body>
</html>
