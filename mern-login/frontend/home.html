<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Health Monitoring Dashboard</title>
  <link rel="stylesheet" href="home.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-content">
    <div class="welcome-text">
      <h2>Hello Kamya 👋</h2>
      <p>Welcome to your health monitoring dashboard</p>
    </div>

    <a href="/index.html">
      <button class="logout-btn">Log out</button>
    </a>
  </div>
</header>


 

<!-- Reminder Section -->
<section class="reminder-section">
  <div class="reminder-box">
    <h3>⏰ Set a Health Reminder</h3>
    <p>
      Stay consistent with your care. Set reminders for medication,
      vitals check, or doctor visits.
    </p>
   <a href="/reminder/">
        <button class="reminder">Reminder</button>
    </a>
  </div>
</section>


  <!-- Vital Cards -->
  <div class="cards">
    <div class="card">
      <h3>Heart Rate</h3>
      <p id="hrValue">-- bpm</p>
    </div>
    <div class="card">
      <h3>Blood Pressure</h3>
      <p id="bpValue">-- / --</p>
    </div>
    <div class="card">
      <h3>Oxygen Level</h3>
      <p id="spo2Value">-- %</p>
    </div>
  </div>

  <!-- Input Form -->
  <div class="form">
    <input type="number" id="heartRate" placeholder="Heart Rate (bpm)">
    <input type="text" id="bloodPressure" placeholder="BP (120/80)">
    <input type="number" id="spo2" placeholder="SpO2 (%)">
    <button onclick="addVitals()">Add Reading</button>
  </div>

  <!-- Chart -->
  <div class="chart-container">
    <canvas id="vitalChart"></canvas>
  </div>
</div>

<script src="home.js"></script>

</body>
</html>
